server:
  port: 8082

spring:
  application:
    name: admin-server

  security:
    user:
      name: admin
      password: ${ADMIN_PASSWORD:admin}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    de.codecentric: DEBUG
