version: "3.9"

services:

  mysql:
    image: mysql:8.0
    container_name: spendsmart-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - spendsmart-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: spendsmart-redis
    restart: always
    networks:
      - spendsmart-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: spendsmart-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    networks:
      - spendsmart-network

  eureka-server:
    image: ${DOCKERHUB_USERNAME}/spendsmart-eureka:latest
    container_name: spendsmart-eureka
    restart: always
    ports:
      - "8761:8761"
    networks:
      - spendsmart-network

  auth-service:
    image: ${DOCKERHUB_USERNAME}/spendsmart-auth:latest
    container_name: spendsmart-auth
    restart: always
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_DATABASE}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_SERVER: http://eureka-server:8761/eureka/
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      RABBITMQ_HOST: rabbitmq
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - spendsmart-network

  expense-service:
    image: ${DOCKERHUB_USERNAME}/spendsmart-expense:latest
    container_name: spendsmart-expense
    restart: always
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${EXPENSE_DB_DATABASE}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_SERVER: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - spendsmart-network

  api-gateway:
    image: ${DOCKERHUB_USERNAME}/spendsmart-gateway:latest
    container_name: spendsmart-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      EUREKA_SERVER: http://eureka-server:8761/eureka/
    networks:
      - spendsmart-network

  admin-server:
    image: ${DOCKERHUB_USERNAME}/spendsmart-admin:latest
    container_name: spendsmart-admin
    restart: always
    environment:
      EUREKA_SERVER: http://eureka-server:8761/eureka/
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    networks:
      - spendsmart-network

  income-service:
    image: ${DOCKERHUB_USERNAME}/spendsmart-income:latest
    container_name: spendsmart-income
    restart: always
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/spendsmart_income?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_SERVER: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - spendsmart-network

  category-service:
    image: ${DOCKERHUB_USERNAME}/spendsmart-category:latest
    container_name: spendsmart-category
    restart: always
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${CATEGORY_DB_DATABASE}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_SERVER: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - spendsmart-network

  budget-service:
    image: ${DOCKERHUB_USERNAME}/spendsmart-budget:latest
    container_name: spendsmart-budget
    restart: always
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${BUDGET_DB_DATABASE}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_SERVER: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - spendsmart-network

  analytics-service:
    image: ${DOCKERHUB_USERNAME}/spendsmart-analytics:latest
    container_name: spendsmart-analytics
    restart: always
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/spendsmart_analytics?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_SERVER: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - spendsmart-network

  recurring-transaction-service:
    image: ${DOCKERHUB_USERNAME}/spendsmart-recurring:latest
    container_name: spendsmart-recurring
    restart: always
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/recurring_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_SERVER: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - spendsmart-network

  notification-service:
    image: ${DOCKERHUB_USERNAME}/spendsmart-notification:latest
    container_name: spendsmart-notification
    restart: always
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${NOTIFICATION_DB_DATABASE}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_SERVER: http://eureka-server:8761/eureka/
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      RABBITMQ_HOST: rabbitmq
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - spendsmart-network

  payment-service:
    image: ${DOCKERHUB_USERNAME}/spendsmart-payment:latest
    container_name: spendsmart-payment
    restart: always
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_SERVER: http://eureka-server:8761/eureka/
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - spendsmart-network

  frontend:
    image: ${DOCKERHUB_USERNAME}/spendsmart-frontend:latest
    container_name: spendsmart-frontend
    restart: always
    ports:
      - "80:80"
    networks:
      - spendsmart-network

networks:
  spendsmart-network:
    driver: bridge

volumes:
  mysql_data:
