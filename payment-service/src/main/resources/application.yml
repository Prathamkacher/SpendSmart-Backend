server:
  port: 8091
  servlet:
    context-path: /api

spring:
  application:
    name: payment-service
  boot:
    admin:
      client:
        url: ${ADMIN_SERVER_URL:http://admin-server:8082}
        instance:
          service-base-url: http://spendsmart-payment:8091/api
          management-base-url: http://spendsmart-payment:8091/api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# Razorpay Config
razorpay:
  key-id: "rzp_test_SiSpar0VNBlTDJ"
  key-secret: "UE8ifv4y7QcXOCElwcdFWxsy"

# JWT Config (Must match other services)
