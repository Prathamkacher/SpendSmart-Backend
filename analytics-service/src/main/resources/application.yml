server:
  port: 8087
  servlet:
    context-path: /api

spring:
  application:
    name: analytics-service
  boot:
    admin:
      client:
        url: ${ADMIN_SERVER_URL:http://admin-server:8082}
        instance:
          service-base-url: http://spendsmart-analytics:8087/api
          management-base-url: http://spendsmart-analytics:8087/api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/analytics_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  flyway:
    enabled: true
    baseline-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# JWT Config
jwt:
  secret: ${JWT_SECRET:4mZ7qW2v5y8B/E(H+MbQeThWmZq4t7w9z$C&F)J@NcRfUjXn2r5u8x/A?D*G-KaPdS}

logging:
  level:
    org.springframework.web: INFO
    com.spendsmart.analytics: DEBUG
    org.hibernate.SQL: DEBUG

feign:
  circuitbreaker:
    enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
    instances:
      auth-service:
        baseConfig: default
      expense-service:
        baseConfig: default
      income-service:
        baseConfig: default
      notification-service:
        baseConfig: default
      budget-service:
        baseConfig: default
